services:
  db:
    image: postgres:16-alpine
    container_name: licitacions-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-licitacions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licitacions}
      POSTGRES_DB: ${POSTGRES_DB:-licitacions}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licitacions} -d ${POSTGRES_DB:-licitacions}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: licitacions-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea el bucket de documents i acaba. No és un servei de llarga durada.
  minio-init:
    image: minio/mc:latest
    container_name: licitacions-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-licitacions-documents}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$STORAGE_BUCKET &&
      echo 'bucket ready'
      "

  # Reservat per a workers futurs (Celery/RQ). Cap procés hi escriu encara.
  redis:
    image: redis:7-alpine
    container_name: licitacions-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: licitacions-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      STORAGE_ENDPOINT_URL: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: licitacions-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run dev"

volumes:
  postgres_data:
  minio_data:
