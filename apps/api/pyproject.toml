[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "licitacions-api"
version = "0.1.0"
description = "API de la plataforma de licitacions publiques (perfil d'empresa + evidencies)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    "email-validator>=2.2",
    # Client HTTP de la ingestio (i tambe dels tests).
    "httpx>=0.27",
    # Parseig XML endurit: protegeix contra XXE i expansio d'entitats.
    "defusedxml>=0.7.1",
    # Extraccio de text de PDF. BSD-3-Clause: a diferencia de PyMuPDF (AGPL),
    # no obliga a publicar el codi d'un servei SaaS. Python pur, sense
    # dependencies de sistema.
    "pypdf>=5.1",
    # Zones horaries a Windows (a Linux les aporta el sistema).
    "tzdata>=2024.1",
    # SDK del proveidor d'inferencia real. Nomes l'importa
    # `app/ai/providers/anthropic.py`, i de manera diferida: sense credencial
    # l'aplicacio arrenca igual i queda no disponible nomes l'analisi de plecs.
    # Sense el paquet, pero, `is_available()` deia "falta la credencial" quan el
    # que faltava era la dependencia, i cap benchmark real es podia executar.
    "anthropic>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI usa crides a Depends() als valors per defecte
